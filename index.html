<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel x DC</title>
    <script src="js/script.js" defer></script>
    <!-- <script src="js/carrinho.js" defer></script> -->

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Helvetica', Arial, sans-serif;
        }

        /* Header */
        header {
            background: linear-gradient(120deg, #070347 0%, #0b1a73 100%);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #e63946;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        /* Efeito scroll */
        header.scrolled {
            background: rgba(7, 3, 71, 0.95);
            height: 80px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
        }

        /* Carrinho */
        .car {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .car img {
            width: 30px;
            height: 30px;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .car:hover img {
            transform: scale(1.15);
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        /* Título */
        header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            flex: 1;
            line-height: 1.2;
        }

        header h1 span {
            display: block;
            font-size: 16px;
            color: #ffd700;
            font-weight: 600;
        }

        /* Botões login/cadastro */
        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .header-buttons a {
            text-decoration: none;
        }

        .header-buttons button {
            background: linear-gradient(135deg, #e63946, #ff4b5c);
            color: #fff;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.5);
        }

        .header-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(230, 57, 70, 0.6);
        }

        /* Container do conteúdo */
        .container {
            background-color: #f2f2f2;
            min-height: 100vh;
            padding: 140px 20px 20px;
        }

        /* Responsividade */
        @media screen and (max-width: 900px) {
            header {
                flex-direction: column;
                height: auto;
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
                margin: 10px 0;
            }

            .header-buttons {
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body onload="montaHTML()">

    <header>
        <!-- Carrinho -->
        <a onclick="calculaCesta()" class="car" href="#">
            <img src="imagens/carrinho.png" alt="Carrinho de compras">
            <span>Compras</span>
        </a>

        <!-- Título central -->
        <h1>Loja dos Nerds<br>Vingadores x Liga da Justiça</h1>

        <!-- Botões de login e cadastro -->
        <div class="header-buttons">
            <a href="login.html"><button>Login</button></a>
            <a href="cadastro.html"><button>Cadastro</button></a>
            <a href="produto.html"><button>Admin</button></a>
        </div>
    </header>

    <div class="container">
        <!-- Seu conteúdo da página aqui -->
    </div>

</body>
</html>
