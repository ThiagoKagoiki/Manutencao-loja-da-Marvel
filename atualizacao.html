<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            background-color: #070347;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid red;
        }

        header h1 {
            font-size: 20px;
        }

        header nav a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        header nav a:hover {
            color: white;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        .container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #070347;
        }

        /* Formulário */
        .form-produto {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: bold;
            color: #070347;
        }

        input, textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            background-color: #e63946;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #c02632;
        }

        #image-preview img {
            display: block;
            margin-top: 10px;
            max-height: 150px;
            object-fit: cover;
        }

        /* Lista de produtos */
        #admin-list {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            background: #fafafa;
        }

        .card img {
            max-width: 100%;
            border-radius: 6px;
        }

        .price {
            font-weight: bold;
            color: #070347;
        }

        .btn.danger {
            background: #e63946;
            color: #fff;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn.danger:hover {
            background: #c02632;
        }
    </style>
</head>
<body>

    <header>
        <h1>Área do Administrador</h1>
        <nav>
            <a href="index.html">🏠 Home</a>
        </nav>
    </header>

    <main class="container">
        <h2>Cadastro de Produto</h2>
        <form id="form-prod" class="form-produto">
            <label for="produto">Nome do Produto:</label>
            <input type="text" id="produto" name="nome" placeholder="Digite o nome do produto" required>

            <label for="codigo">Código do Produto:</label>
            <input type="text" id="codigo" name="codigo" placeholder="Digite o código" required>

            <label for="preco">Preço do Produto:</label>
            <input type="number" id="preco" name="preco" placeholder="Digite o preço" required>

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" placeholder="Escreva uma breve descrição" required></textarea>

            <label for="arq">Imagem para o site:</label>
            <input type="file" name="imagem" id="arq" accept="image/*" required>
            <div id="image-preview"></div>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <!-- Lista de produtos -->
        <section id="admin-list"></section>
    </main>

<script type="module">
    import { createProdutoFD, fetchProdutos, deleteProduto } from './api.js';
    import { Produto } from './product.js';
    import { requireUser } from './store.js';

    const user = requireUser();
    if (!user.admin) window.location.href = 'index.html';

    const form = document.getElementById('form-prod');
    const list = document.getElementById('admin-list');
    const fileInput = document.getElementById('arq');
    const previewContainer = document.getElementById('image-preview');

    // Envio do formulário
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        try {
            await createProdutoFD(fd);
            form.reset();
            previewContainer.innerHTML = '';
            await render();
            alert('Produto cadastrado!');
        } catch (err) {
            alert('Erro ao salvar: ' + err.message);
        }
    });

    // Preview da imagem
fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) {
        previewContainer.innerHTML = '';
        return;
    }

    // Gera a URL da imagem diretamente
    const imageURL = URL.createObjectURL(file);

    previewContainer.innerHTML = `
        <img src="${imageURL}" 
             alt="Pré-visualização" 
             style="max-width: 200px; 
                    max-height: 200px;
                    border-radius: 6px; 
                    box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
                    margin-top: 10px;">
    `;
});

    // Lista de produtos
    async function render() {
        try {
            const produtos = (await fetchProdutos()).map(p => new Produto(p));
            list.innerHTML = produtos.map(p => `
                <div class="card">
                    <img src="${p.imagem_url}" alt="${p.nome}">
                    <h3>${p.nome}</h3>
                    <p class="price">R$ ${p.precoBRL()}</p>
                    <div class="actions">
                        <button class="btn danger" data-del="${p.id}">Excluir</button>
                    </div>
                </div>
            `).join('');

            list.querySelectorAll('button[data-del]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Excluir este produto?')) return;
                    await deleteProduto(Number(btn.dataset.del));
                    await render();
                });
            });
        } catch (err) {
            list.innerHTML = `<p style="color:red;">Erro ao carregar produtos: ${err.message}</p>`;
        }
    }

    // Carrega lista ao abrir a página
    render();
</script>
</body>
</html>
